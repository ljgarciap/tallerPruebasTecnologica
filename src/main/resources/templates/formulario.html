<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taller QA - Sistema de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; display: flex; gap: 30px; justify-content: center; }
        .form-container { width: 350px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); height: fit-content; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        button.btn-secundario { background-color: #28a745; margin-top: 10px; }
        button.btn-secundario:hover { background-color: #218838; }
        .alert-success { color: green; font-weight: bold; margin-top: 15px; display: none; }
        .resultado-busqueda { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; background-color: #e2e3e5; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registro de Usuario</h2>
    <form id="userForm">
        <div class="form-group">
            <label for="username">Nombre de Usuario:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" id="btnEnviar">Registrar</button>
    </form>

    <div id="mensajeExito" class="alert-success">¡Usuario registrado con éxito!</div>
</div>

<div class="form-container">
    <h2>Consultar Usuario</h2>
    <div class="form-group">
        <label for="searchUsername">Buscar por Username:</label>
        <input type="text" id="searchUsername" placeholder="Ej: luis_garcia">
    </div>
    <button id="btnBuscar" class="btn-secundario">Buscar en el Sistema</button>

    <div id="resultadoBusqueda" class="resultado-busqueda"></div>
</div>

<script>
    // LÓGICA PARA REGISTRAR (POST)
    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        fetch('/api/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(response => {
            if(response.status === 201) {
                document.getElementById('mensajeExito').style.display = 'block';
                document.getElementById('userForm').reset();
            }
        })
        .catch(error => console.error('Error:', error));
    });

    // LÓGICA PARA BUSCAR (GET)
    document.getElementById('btnBuscar').addEventListener('click', function() {
        const usernameABuscar = document.getElementById('searchUsername').value;
        const divResultado = document.getElementById('resultadoBusqueda');

        if(!usernameABuscar.trim()) return;

        fetch('/api/usuarios/' + usernameABuscar)
        .then(response => {
            if (response.status === 200) {
                return response.json();
            } else {
                throw new Error('Usuario no encontrado');
            }
        })
        .then(data => {
            divResultado.style.display = 'block';
            divResultado.style.color = 'blue';
            divResultado.innerText = 'Resultado: ' + data.usuarioEncontrado + ' (' + data.resultado + ')';
        })
        .catch(error => {
            divResultado.style.display = 'block';
            divResultado.style.color = 'red';
            divResultado.innerText = 'Error: Usuario no existe';
        });
    });
</script>
</body>
</html>
